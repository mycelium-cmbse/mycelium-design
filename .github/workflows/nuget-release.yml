name: Nuget-Release

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Which design package to release'
        required: true
        type: choice
        options:
          - forge
          - bloom
      version:
        description: 'SemVer (e.g., 1.2.3 or 1.2.3-beta.1)'
        required: true
        type: string
      archive:
        description: 'Designer DTCG export (.zip): an https URL or a path relative to the repository root'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PRODUCT: ${{ github.event.inputs.product }}
      ARCHIVE: ${{ github.event.inputs.archive }}
      DESIGN_TOOLS: .github/scripts/design-tools.cs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Resolve project
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            forge)
              echo "PACKAGE_ID=Mycelium.Design.Forge" >> "$GITHUB_ENV"
              echo "PROJECT_PATH=Mycelium.Design.Forge/Mycelium.Design.Forge.csproj" >> "$GITHUB_ENV"
              echo "CSS_DIR=Mycelium.Design.Forge/css" >> "$GITHUB_ENV"
              ;;
            bloom)
              echo "PACKAGE_ID=Mycelium.Design.Bloom" >> "$GITHUB_ENV"
              echo "PROJECT_PATH=Mycelium.Design.Bloom/Mycelium.Design.Bloom.csproj" >> "$GITHUB_ENV"
              echo "CSS_DIR=Mycelium.Design.Bloom/css" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown product '$PRODUCT'." >&2
              exit 1
              ;;
          esac

      - name: Validate version (SemVer)
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z\.-]+)?$ ]]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            if [[ "$VERSION" == *-* ]]; then
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          else
            echo "Provided version '$VERSION' is not SemVer." >&2
            exit 1
          fi

      - name: Set date
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Update CITATION.cff (version + date)
        run: |
          set -euo pipefail
          sed -i "s/^version:.*/version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff
          sed -i "s/^  version:.*/  version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^  date-released:.*/  date-released: \"${DATE}\"/" CITATION.cff

      - name: Update <Version> in the released project's .csproj
        run: |
          set -euo pipefail
          sed -i "0,/<Version>.*<\/Version>/s//<Version>${VERSION}<\/Version>/" "${PROJECT_PATH}"

          STAMPED=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "${PROJECT_PATH}" | head -1)
          if [ "$STAMPED" != "$VERSION" ]; then
            echo "Failed to stamp <Version> in ${PROJECT_PATH}: found '${STAMPED}', expected '${VERSION}'." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Ingest designer export
        run: dotnet run --file "${DESIGN_TOOLS}" -- ingest "${ARCHIVE}" "${RUNNER_TEMP}/tokens"

      - name: Validate DTCG tokens
        run: dotnet run --file "${DESIGN_TOOLS}" -- validate "${RUNNER_TEMP}/tokens"

      - name: Generate CSS
        run: dotnet run --file "${DESIGN_TOOLS}" -- generate "${RUNNER_TEMP}/tokens" generator "${PRODUCT}" "${CSS_DIR}"

      - name: Stamp release metadata into the generated CSS
        # Must run before Pack: NuGet stages <None Pack="true"> content during Build.
        run: dotnet run --file "${DESIGN_TOOLS}" -- stamp-css "${CSS_DIR}" "${VERSION}" "${PACKAGE_ID}" "${DATE}"

      - name: Pack
        run: dotnet pack -c Release -o ReleaseBuilds "${{ env.PROJECT_PATH }}"

      - name: Verify packed version
        run: |
          set -euo pipefail
          if [ ! -f "ReleaseBuilds/${PACKAGE_ID}.${VERSION}.nupkg" ]; then
            echo "Expected ReleaseBuilds/${PACKAGE_ID}.${VERSION}.nupkg, but ReleaseBuilds holds:" >&2
            ls -1 ReleaseBuilds >&2
            exit 1
          fi

      - name: Commit CSS and version stamps to default branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "${CSS_DIR}"
          git add "${PROJECT_PATH}" CITATION.cff

          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${PACKAGE_ID} ${VERSION} (regenerate and stamp CSS, update csproj and CITATION.cff)"
            git push origin HEAD:${DEFAULT_BRANCH}
          else
            echo "No changes to ${CSS_DIR}, ${PROJECT_PATH}, or CITATION.cff."
          fi

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "ReleaseBuilds/${PACKAGE_ID}.${VERSION}.nupkg" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create annotated tag at this commit
        run: |
          TAG="${PRODUCT}/${VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag -a "${TAG}" -m "Release ${PACKAGE_ID} ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Create draft GitHub release (attach nupkg)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ env.PRERELEASE }}
          name: "${{ env.PACKAGE_ID }} ${{ env.VERSION }}"
          tag_name: ${{ env.TAG }}
          body: |
            ${{ env.PACKAGE_ID }} ${{ env.VERSION }}

            See the package's `PackageReleaseNotes` on NuGet.org for details, or the commit history since the previous `${{ env.PRODUCT }}/*` tag.
          files: |
            ReleaseBuilds/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
